name: TraceHarvest CI Safeguards & Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-build:
    name: Typecheck, Test, and Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Strict Typecheck Guard
        run: npm run lint

      - name: Certified Production Build & Safeguard Sentinel
        run: npm run build

      - name: Verify Build Artifacts & Zero Test Farmer Certification
        run: |
          test -f dist/index.html || exit 1
          test -f dist/build-verification.json || exit 1
          echo "Build integrity confirmed and certified."
