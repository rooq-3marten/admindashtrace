version: '3.8'

services:
  api:
    build: .
    container_name: traceharvest-fastapi-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:traceharvest_secure_2026@postgres:5432/traceharvest_db
      - SECRET_KEY=traceharvest_central_secret_key_nigeria_2026
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: traceharvest-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: traceharvest_secure_2026
      POSTGRES_DB: traceharvest_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
